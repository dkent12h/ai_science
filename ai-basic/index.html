<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초등 AI 기초 실습 · DK AI Science</title>
<meta name="description" content="AI for Oceans, 티처블 머신, 엔트리, 마이크로비트로 따라 하는 초등 AI 기초 실습">
<meta name="theme-color" content="#eeeef1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b10;--muted:#6a6a76;--line:rgba(11,11,16,.16);--acc:#7c4dff;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;overflow:hidden;word-break:keep-all;overflow-wrap:break-word;color:var(--ink);
  background:radial-gradient(120% 90% at 72% 18%,#fbfbfc 0%,#ececf1 58%,#dedee8 100%) fixed;
  font-family:"Inter Tight","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* 위쪽 줄 */
header{flex:none;height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(16px,3vw,40px)}
.brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.mini{width:28px;height:28px;border-radius:8px;background:#111;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:6px}
.mini i{border-radius:50%;background:#3b1616}.mini i.on{background:#ff3b30}
.pill{border:1.5px solid var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;background:transparent;color:var(--ink);transition:background .25s,color .25s}
.pill:hover:not(:disabled){background:var(--ink);color:#fff}
.pill:disabled{opacity:.35;cursor:default}
.pill.solid{background:var(--ink);color:#fff}
.pill.solid:hover:not(:disabled){background:var(--acc);border-color:var(--acc)}

/* 책 무대 */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.book{position:relative;perspective:2600px}
.leaf{position:absolute;top:0;height:100%;width:50%;overflow:hidden}
.leaf.left{left:0}.leaf.right{left:50%}
.book.one .leaf.right{left:0;width:100%}.book.one .leaf.left,.book.one .flip{display:none}
.page{position:absolute;inset:0;background:rgba(255,255,255,.82);border:1.5px solid var(--line);padding:calc(var(--u)*5.2) calc(var(--u)*6) calc(var(--u)*7.2);display:flex;flex-direction:column;overflow:hidden;
  font-size:calc(var(--u)*3.15);line-height:1.55}
.leaf.left .page,.face.l .page{border-radius:calc(var(--u)*4) 0 0 calc(var(--u)*4);border-right-color:rgba(11,11,16,.08)}
.leaf.right .page,.face.r .page{border-radius:0 calc(var(--u)*4) calc(var(--u)*4) 0;border-left-color:rgba(11,11,16,.08)}
.book.one .leaf.right .page{border-radius:calc(var(--u)*4)}
.leaf.left .page::after,.face.l .page::after{content:"";position:absolute;top:0;right:0;bottom:0;width:calc(var(--u)*7);background:linear-gradient(90deg,transparent,rgba(11,11,16,.10));pointer-events:none}
.leaf.right .page::after,.face.r .page::after{content:"";position:absolute;top:0;left:0;bottom:0;width:calc(var(--u)*7);background:linear-gradient(270deg,transparent,rgba(11,11,16,.10));pointer-events:none}
.book.one .leaf.right .page::after{display:none}
.book{filter:drop-shadow(0 30px 40px rgba(30,20,70,.18))}
.flip{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;display:none;will-change:transform}
.flip.on{display:block}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.pfoot{position:absolute;left:calc(var(--u)*6);right:calc(var(--u)*6);bottom:calc(var(--u)*3);display:flex;justify-content:space-between;font-size:calc(var(--u)*2.3);font-weight:700;color:var(--muted)}
.leaf.left .pfoot,.face.l .pfoot{flex-direction:row}
.leaf.right .pfoot,.face.r .pfoot{flex-direction:row-reverse}

/* 페이지 내용 */
.eb{font-size:calc(var(--u)*2.6);font-weight:800;color:var(--c,var(--acc));letter-spacing:.01em;margin:0 0 calc(var(--u)*1.6)}
.ttl{margin:0;font-size:calc(var(--u)*5.4);line-height:1.12;letter-spacing:-.045em;font-weight:800;text-wrap:balance}
.body{margin-top:calc(var(--u)*3.4);display:flex;flex-direction:column;gap:calc(var(--u)*2.1);min-height:0;flex:1}
.body p{margin:0}
.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.9)}
.bl li{position:relative;padding-left:calc(var(--u)*4.4);font-weight:500}
.bl li::before{content:"";position:absolute;left:calc(var(--u)*.6);top:calc(var(--u)*1.55);width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;background:var(--c,var(--acc))}
.nt{list-style:none;margin:0;padding:calc(var(--u)*2.6) calc(var(--u)*3);background:rgba(11,11,16,.05);border-radius:calc(var(--u)*2.6);display:flex;flex-direction:column;gap:calc(var(--u)*1.4);font-size:calc(var(--u)*2.8);color:#454552;font-weight:500}
.nt li{position:relative;padding-left:calc(var(--u)*2.8)}
.nt li::before{content:"※";position:absolute;left:0;color:var(--c,var(--acc));font-weight:800}
.stm{font-size:calc(var(--u)*4.1);line-height:1.38;font-weight:700;letter-spacing:-.03em}
.nums{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(var(--u)*2.6)}
.nums li{display:flex;gap:calc(var(--u)*2.8);align-items:flex-start;font-weight:500;font-size:calc(var(--u)*3.25)}
.nums .n{flex:none;width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);border-radius:50%;background:var(--c,var(--acc));color:#fff;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*3.2);margin-top:calc(var(--u)*-.4)}
.stepno{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:50%;background:var(--c,var(--acc));color:#fff;display:grid;place-items:center;font-weight:800;font-size:calc(var(--u)*5.6);letter-spacing:-.04em;margin-bottom:calc(var(--u)*3)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*2.2);counter-reset:p;align-content:start}
.parts li{counter-increment:p;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:calc(var(--u)*1.6);padding:calc(var(--u)*2.2) calc(var(--u)*2) calc(var(--u)*2.4);border:1.5px solid var(--line);border-radius:calc(var(--u)*3);font-size:calc(var(--u)*3.3);line-height:1.3;font-weight:700;background:rgba(255,255,255,.8);text-align:center;word-break:keep-all}
.parts li::before{content:counter(p);position:absolute;left:calc(var(--u)*1.8);top:calc(var(--u)*1.8);width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:calc(var(--u)*2.8);font-weight:800;z-index:1}
.parts .th{order:-1;margin:0;display:flex;gap:calc(var(--u)*1.4);justify-content:center;align-items:center;width:100%;height:calc(var(--u)*24)}
.parts .th img{height:100%;width:auto;max-width:100%;min-width:0;object-fit:contain;border-radius:calc(var(--u)*1.6);background:#fff}
.parts .th img:only-child{max-width:100%}
.parts .th:has(img+img) img{max-width:48%}
.parts.many .th,.parts.five .th{height:calc(var(--u)*17)}
.parts.dense{gap:calc(var(--u)*1.2)}
.parts.dense li{gap:calc(var(--u)*.6);padding:calc(var(--u)*1.2) calc(var(--u)*1.2) calc(var(--u)*1.2);font-size:calc(var(--u)*2.9)}
.parts.dense li::before{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);font-size:calc(var(--u)*2.4);left:calc(var(--u)*1.2);top:calc(var(--u)*1.2)}
.parts.dense .th{height:calc(var(--u)*9.5)}
.chips{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1)}
.chip{display:inline-flex;align-items:center;gap:calc(var(--u)*1.2);border:1.5px solid var(--c,var(--acc));color:var(--c,var(--acc));border-radius:999px;padding:calc(var(--u)*1.3) calc(var(--u)*3.2);font-weight:800;font-size:calc(var(--u)*2.9);text-decoration:none;background:transparent}
a.chip{background:var(--c,var(--acc));color:#fff}
.tag{align-self:flex-start;font-size:calc(var(--u)*2.5);font-weight:800;background:rgba(11,11,16,.07);border-radius:999px;padding:calc(var(--u)*.7) calc(var(--u)*2.4)}
.lk{display:flex;flex-direction:column;gap:calc(var(--u)*2)}
.lk a{display:block;border:1.5px solid var(--ink);border-radius:calc(var(--u)*3);padding:calc(var(--u)*2.6) calc(var(--u)*3.2);text-decoration:none;transition:background .25s,color .25s}
.lk a:hover{background:var(--ink);color:#fff}
.lk b{display:block;font-size:calc(var(--u)*3.4)}
.lk span{display:block;font-size:calc(var(--u)*2.3);font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;opacity:.7;margin-top:calc(var(--u)*.6)}
.qr{width:calc(var(--u)*24);height:calc(var(--u)*24);padding:calc(var(--u)*2);background:#fff;border:1.5px solid var(--line);border-radius:calc(var(--u)*2.4)}
.qr svg{width:100%;height:100%;display:block}
.fig{margin:0;border-radius:calc(var(--u)*2.6);overflow:hidden;border:1.5px solid var(--line);background:#fff}
.fig img,.fig video,.fig iframe{display:block;width:100%;height:auto;border:0;aspect-ratio:16/9;object-fit:contain}
.body{flex:1}
.fig{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0}
.fig img{width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:auto;object-fit:contain;border-radius:calc(var(--u)*2);border:1.5px solid var(--line);background:#fff}
.fig.svg{flex:1 1 0;min-height:0;background:#fff;border:1.5px solid var(--line);border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*2.4);margin-top:calc(var(--u)*1)}
.fig.svg svg{width:100%;height:100%;display:block}
.fig.svg.dark{flex:1 1 0;min-height:0;background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.fig.svg.dark svg{height:100%;width:auto;max-width:100%;max-height:100%}
.fig.vid{flex:none;width:100%;border:0}
.fig.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:calc(var(--u)*2.4);background:#000}
.play{position:relative;display:block;width:100%;padding:0;border:0;border-radius:calc(var(--u)*2.4);overflow:hidden;background:#111;aspect-ratio:16/9}
.play img{width:100%;height:100%;max-height:none;object-fit:cover;border:0;border-radius:0;display:block;opacity:.85}
.tri{position:absolute;left:50%;top:50%;width:calc(var(--u)*13);height:calc(var(--u)*13);margin:calc(var(--u)*-6.5) 0 0 calc(var(--u)*-6.5);border-radius:50%;background:var(--c,#ff3b30);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tri::after{content:"";position:absolute;left:38%;top:28%;border-style:solid;border-width:calc(var(--u)*3.6) 0 calc(var(--u)*3.6) calc(var(--u)*5.6);border-color:transparent transparent transparent #fff}
a.tag{text-decoration:none;color:var(--ink)}
.page.divider .fig{flex:none;margin-bottom:calc(var(--u)*4)}
.page.divider .fig img{max-height:calc(var(--u)*50)}
.big{font-size:calc(var(--u)*10.5);font-weight:800;letter-spacing:-.06em;line-height:1.02;text-wrap:balance}
.para{font-size:calc(var(--u)*3.45);line-height:1.72;font-weight:500;color:#25252d;text-wrap:pretty}
.para.s{font-size:calc(var(--u)*3);line-height:1.62}
.fields{display:flex;flex-direction:column;gap:calc(var(--u)*2);flex:1 1 0;min-height:0}
.ff{display:flex;flex-direction:column;gap:calc(var(--u)*1.1);flex:1 1 0;min-height:0}
.ff span{font-weight:800;font-size:calc(var(--u)*2.9);color:var(--c,var(--acc))}
.ff textarea{flex:1;min-height:calc(var(--u)*8);width:100%;resize:none;border:1.5px solid var(--line);border-radius:calc(var(--u)*2.2);padding:calc(var(--u)*1.8) calc(var(--u)*2.4);font:inherit;font-size:calc(var(--u)*3.1);line-height:1.5;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.ff textarea:focus{outline:2px solid var(--c,var(--acc));outline-offset:1px}

/* 표지 · 장 표지 */
.page.cover{background:#0b0b10;color:#fff;border-color:#0b0b10}
.page.cover .pfoot{color:rgba(255,255,255,.55)}
.page.cover::after{display:none}
.rgb{flex:1;min-height:0;margin:calc(var(--u)*2) 0;display:grid;grid-template-columns:repeat(5,1fr);gap:6%;align-content:center;padding:0 12%}
.rgb i{display:none}
.rgb::before{content:"";display:none}
.rgb.cvart{display:block;padding:0}.rgb.cvart svg{width:100%;height:100%;display:block}
.led{aspect-ratio:1;border-radius:50%;background:#2a2a33}
.led.on{background:var(--c,#ff3b30);box-shadow:0 0 calc(var(--u)*3) var(--c,#ff3b30)}
.cv-t{font-size:calc(var(--u)*6.1);font-weight:800;letter-spacing:-.06em;line-height:1}
.cv-s{font-size:calc(var(--u)*3.6);font-weight:700;opacity:.7;margin-top:calc(var(--u)*1.6)}
.cv-e{font-size:calc(var(--u)*2.8);font-weight:700;opacity:.65;margin-bottom:calc(var(--u)*2)}
.page.divider{justify-content:flex-end}
.page.divider .no{font-size:calc(var(--u)*3.2);font-weight:800;color:var(--c);margin-bottom:calc(var(--u)*2)}
.page.divider .bar{width:calc(var(--u)*14);height:calc(var(--u)*1.6);border-radius:99px;background:var(--c);margin-bottom:calc(var(--u)*4)}
.page.blank{background:transparent;border-color:transparent;box-shadow:none}
.page.blank::after{display:none}
.endp{justify-content:center;align-items:flex-start;gap:calc(var(--u)*3)}

/* 아래 조작줄 */
.ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px clamp(12px,3vw,40px) calc(14px + env(safe-area-inset-bottom));min-height:68px}
.prog{flex:1;max-width:560px;display:flex;flex-direction:column;gap:4px;align-items:center}
.prog small{font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.02em}
input[type=range]{width:100%;accent-color:var(--ink);height:18px;margin:0}

/* 목차 (왼쪽 서랍) */
.toc{position:fixed;inset:0;z-index:50;display:none;background:rgba(11,11,16,.32)}
.toc.on{display:block}
.toc-in{position:absolute;left:0;top:0;bottom:0;width:min(460px,92vw);background:#f4f4f8;overflow:auto;padding:22px clamp(18px,3vw,32px) 40px;box-shadow:12px 0 50px rgba(0,0,0,.22);animation:drawer .28s cubic-bezier(.3,.7,.2,1)}
@keyframes drawer{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.toc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.toc h3{font-size:clamp(30px,4vw,42px);letter-spacing:-.05em;margin:0;font-weight:800}
.toc .ch{border-bottom:1.5px solid var(--line)}
.toc .chap{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:17px 6px;font-size:clamp(22px,2.3vw,27px);font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.toc .chap::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.toc .chap .rg{margin-left:auto;font-size:14px;color:var(--muted);font-weight:700}
.toc .chap .chev{width:10px;height:10px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin:-4px 4px 0 8px;transition:transform .2s;flex:none}
.toc .ch.open .chap .chev{transform:rotate(225deg);margin-top:4px}
.toc .chap:hover{background:rgba(11,11,16,.05)}
.toc .ch ol{display:none;border-top:0;margin:0 0 12px 26px}
.toc .ch.open ol{display:block}
.toc ol{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.toc li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 10px;font-size:clamp(15px,1.4vw,16.5px);font-weight:600;letter-spacing:-.03em;color:var(--ink);border-radius:0}
.toc li button:hover{background:rgba(11,11,16,.05)}
.toc li button.cur{background:var(--c);color:#fff;border-radius:10px}
.toc li button.cur .pg{color:rgba(255,255,255,.85)}
.toc li .pg{margin-left:auto;font-size:14px;color:var(--muted);font-weight:700;flex:none}
.tocbtn{position:fixed;left:clamp(10px,2vw,28px);top:50%;transform:translateY(-50%);z-index:20;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ink);background:rgba(255,255,255,.85);display:grid;place-items:center;color:var(--ink);transition:background .25s,color .25s;box-shadow:0 8px 24px rgba(30,20,70,.14)}
.tocbtn:hover{background:var(--ink);color:#fff}
.tocbtn svg{width:24px;height:24px}
@media (max-width:900px){.tocbtn{top:auto;bottom:12px;left:10px;transform:none;width:46px;height:46px}.ctrl{padding-left:64px}}
@media (prefers-reduced-motion:reduce){.flip{transition:none!important}}

/* 적응형 퀴즈 */
.page.quiz .qt{font-size:calc(var(--u)*3.9);line-height:1.35;margin:calc(var(--u)*1) 0 calc(var(--u)*1.2)}.page.quiz .body{min-height:0;display:flex;flex-direction:column}
.qmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:calc(var(--u)*1.4)}
.qmeta .rd{font-weight:800;font-size:calc(var(--u)*2.7);color:var(--c)}
.qmeta .dots i{display:inline-block;width:calc(var(--u)*2);height:calc(var(--u)*2);border-radius:50%;background:var(--line);margin-left:calc(var(--u)*.9)}
.qmeta .dots i.on{background:var(--c)}.qmeta .dots i.done{background:var(--c);opacity:.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.5)}.opts.one{grid-template-columns:1fr}
.opt{font:inherit;font-weight:700;font-size:calc(var(--u)*3.3);padding:calc(var(--u)*2.1) calc(var(--u)*2.4);border:1.5px solid var(--line);border-radius:calc(var(--u)*2.2);background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .2s,color .2s}
.opts.one .opt{font-size:calc(var(--u)*3.1);padding:calc(var(--u)*1.7) calc(var(--u)*2.4)}
.opt:hover{border-color:var(--c);color:var(--c)}
.chosen{font-size:calc(var(--u)*2.7);color:var(--muted);margin-bottom:calc(var(--u)*1.4)}.chosen b{color:var(--ink)}
.fbk{flex:0 1 auto;min-height:0;overflow-y:auto;border:1.5px solid var(--line);border-left:calc(var(--u)*1.2) solid var(--k);border-radius:calc(var(--u)*2);background:#fff;padding:calc(var(--u)*1.6) calc(var(--u)*2.2);display:flex;flex-direction:column;gap:calc(var(--u)*.9)}
.fbk.ok{--k:#16a34a}.fbk.no{--k:#e4174b}
.fbk .vd{font-weight:800;font-size:calc(var(--u)*3.1);color:var(--k)}.fbk .vd small{font-weight:600;font-size:calc(var(--u)*2.4);color:var(--muted);margin-left:calc(var(--u)*1.2)}
.fbk p{margin:0;font-size:calc(var(--u)*2.55);line-height:1.45;font-weight:500;color:#25252d}
.vrow{display:flex;gap:calc(var(--u)*2);align-items:center}
.vrow .play{flex:none;width:calc(var(--u)*23);position:relative;border:0;padding:0;background:#000;border-radius:calc(var(--u)*1.6);overflow:hidden;aspect-ratio:16/9;cursor:pointer}
.vrow .play img{display:block;width:100%;height:100%;object-fit:cover;opacity:.85}
.vrow .tri{position:absolute;left:50%;top:50%;width:calc(var(--u)*7);height:calc(var(--u)*7);margin:calc(var(--u)*-3.5) 0 0 calc(var(--u)*-3.5);border-radius:50%;background:rgba(255,255,255,.92)}

: 인공지능 또는 A.I.(Artificial Intelligence)는 인간의 학습 능력, 추론 능력, 지각 능력을 인공적으로 구현하려는 컴퓨터과학의 세부 분야 중 하나이며, 인간을 포함한 동물이 갖고 있는 지능 즉, natural intelligence와는 다른 개념입니다.

text|1|1차시 · 인공지능과 머신러닝|인공지능의 지금과 앞으로|

: 지금은 저장된 정보를 바탕으로 정해진 상황에서 작업을 수행하는 수준의 인공지능입니다. 하지만 앞으로는 문제 상황을 스스로 인식해서 해결책을 제시하고, 자신의 의견까지 표현하는 수준에 이를 것으로 예상되고 있습니다.
: 하지만 인공지능이 인간의 삶을 무조건 좋게 만들어 줄 것인지에 대해서는 논란이 있습니다. 인공지능이 발전할수록 사람들이 하는 일을 기계가 대신하게 될 것입니다. 인공지능의 성능이 더욱 뛰어날수록 그만큼 많은 사람들이 일자리를 잃어버릴 수도 있는 것입니다.

text|3|3차시 · 엔트리 블록코딩|코딩 프로그램|
: 인공지능 모델 프로그래밍을 위해서는 코딩 프로그램을 사용해야한다. 초등학생이나 컴퓨터 초급자의 경우에는 처음부터 텍스트로 코딩을 하는 것에 어려움을 느끼는 경우가 많다. 이에 MIT에서는 텍스트를 블록의 형태로 제작하여 블록쌓기의 방법으로 코딩할 수 있는 ‘Scratch’를 개발하여 보급하였다. 현재 블록코딩 프로그램으로는 ‘Scratch’, ‘mBlock’ 등이 있으며, 한국에서 개발한 ‘엔트리(Entry)’라는 프로그램이 있다.

text|3|3차시 · 엔트리 블록코딩|엔트리 프로그램|
: 엔트리는 한국에서 개발한 대표적인 블록코딩 프로그램이다. 현재 학교 및 각종 코딩관련 교육기관에서 가장 많이 사용하는 프로그램 중 하나로, 한글에서 개발했기 때문에 한글화가 잘 되어 있고, 초등학교 실과교육과정에서 쉽게 활용될 수 있도록 따로 구분하여 제공하고 있다. 또한 단순히 코딩을 할 수 있는 도구로 사용되는 것을 뛰어넘어, 학생들이 스스로 학습할 수 있는 교육기능도 제공하고 있어 학생들이나 초급자가 사용하기에 적합한 프로그램이라고 할 수 있다.

  }
  const o = rd.o[s.c], f = Q.fb[o.f], last = s.r >= Q.rounds.length - 1;
  h += `<div class="fbk ${f.ok ? "ok" : "no"}"><div class="vd">${f.ok ? "정답입니다" : "정답이 아닙니다"}<small>내가 고른 답 · ${esc(o.t)}</small></div>`;

  if (f.k.length) h += `<div class="kbox">${f.k.map(x => `<p>${esc(x)}</p>`).join("")}</div>`;
  h += `</div><div class="qact">`;
  if (!f.ok && !last) h += `<button type="button" data-qa="retry" data-q="${id}">다시 풀어보기 (${s.r + 2}차)</button>`;
  if (f.ok || last) h += `<button type="button" data-qa="reset" data-q="${id}">처음부터 다시</button>`;

document.addEventListener("click", e => {

const pages = DATA.trim().split(/\n---\n/).map(blk => {
  const lines = blk.trim().split("\n");
  const [kind, chap, eb, title, num] = lines.shift().split("|");
  const pg = { kind, chap: +chap, eb, title, num, lines: [], toc: null };
  lines.forEach(l => { if (l.startsWith("@toc ")) pg.toc = l.slice(5); else pg.lines.push(l); });
  return pg;
});
pages.push({ kind: "end", chap: 0, eb: "", title: "", lines: [], toc: null });   // 뒤표지
const N = pages.length;

function chipHTML(label, n, urlOverride) {
  const url = urlOverride || (label === "영상" ? MEDIA.video[n] : MEDIA.links[n] && MEDIA.links[n][label]);
  const icon = label === "영상" ? "▶" : label.indexOf("AR") === 0 ? "◎" : label === "공유하기" ? "↗" : "✎";
  return url ? `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">${icon} ${esc(label)}</a>` : `<span class="chip">${icon} ${esc(label)}</span>`;
}
function mediaHTML(n, skipImg) {
  let h = "";
  if (ILLU[n]) h += `<figure class="fig svg${ILLU[n].indexOf("data-dark") > 0 ? " dark" : ""}">${ILLU[n]}</figure>`;
  if (!skipImg) [].concat(MEDIA.img[n] || []).forEach(src => { h += `<figure class="fig"><img src="${esc(src)}" alt="" loading="lazy" decoding="async"></figure>`; });
  const v = MEDIA.video[n];
  if (v) {
    const m = String(v).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
    h += m ? `<figure class="fig vid"><button type="button" class="play" data-yt="${m[1]}" aria-label="영상 재생"><img src="https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg" alt=""><span class="tri"></span></button></figure>`
           : `<figure class="fig vid"><video src="${esc(v)}" controls playsinline></video></figure>`;
  }
  return h;
}
function partsHTML(n, bl) {
  const imgs = MEDIA.img[n] || [], map = PARTS[n];
  const items = bl.split("</li>").filter(Boolean).map(x => x + "</li>");
  return items.map((li, k) => {
    const th = map && map[k] ? map[k].map(j => `<img src="${esc(imgs[j])}" alt="">`).join("") : "";
    return th ? li.replace("</li>", `<span class="th">${th}</span></li>`) : li;
  }).join("");
}
function pageHTML(i) {

      <div class="cv-t">${esc(p.title)}</div><div class="cv-s">${esc(p.lines[0] ? p.lines[0].slice(2) : "")}</div></div>`;

      <div class="ttl" style="font-size:calc(var(--u)*4.4)">초등 AI 기초 실습</div><div class="chips"><a class="chip" href="#p1" data-go="1" style="--c:#0b0b10">처음으로</a></div></div>`;

/* ---------- 책 크기 · 보기 방식 ---------- */
const book = $("#book"), L = $("#L"), R = $("#R"), F = $("#F"), Ff = $("#Ff"), Fb = $("#Fb");
let two = true, cur = 0, busy = false;   // cur: 지금 보이는 첫 쪽(0부터)
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function layout() {
  const st = $("#stage").getBoundingClientRect();
  const aw = st.width - 24, ah = st.height - 16;
  two = aw >= 860 && aw / ah > 1.15;
  const ratio = 0.78;
  let pw, ph;
  if (two) { pw = Math.min(aw / 2, ah * ratio, 760); ph = pw / ratio; }
  else { pw = Math.min(aw, 560); ph = Math.min(ah, pw / 0.62); }
  book.style.width = (two ? pw * 2 : pw) + "px";
  book.style.height = ph + "px";
  book.classList.toggle("one", !two);
  book.style.setProperty("--u", (pw / 100) + "px");
  document.documentElement.style.setProperty("--u", (pw / 100) + "px");
  if (two && cur % 2) cur -= 1;
  render();
}
function render() {
  if (two) { put(L, cur); put(R, cur + 1); }
  else { put(R, cur); }
  ui();
}
function step() { return two ? 2 : 1; }
function ui() {
  const last = Math.min(cur + step(), N);
  $("#pos").textContent = two ? `${cur + 1}–${last} / ${N}` : `${cur + 1} / ${N}`;
  $("#rng").max = N; $("#rng").value = cur + 1;
  $("#prev").disabled = cur <= 0;
  $("#next").disabled = cur + step() >= N;
  const h = "#p" + (cur + 1);
  if (location.hash !== h) history.replaceState(null, "", h);
}

/* ---------- 넘기기 ---------- */
function go(target) {
  if (busy) return;
  target = Math.max(0, Math.min(N - 1, target));
  if (two) target -= target % 2;
  if (target === cur) return;
  const forward = target > cur;
  if (!two || reduce || Math.abs(target - cur) > 2 && false) { cur = target; render(); return; }
  busy = true;
  F.classList.add("on");
  if (forward) {
    // 아래에 새 오른쪽 쪽, 넘어가는 장: 앞면=예전 오른쪽, 뒷면=새 왼쪽
    put(R, target + 1);
    Ff.className = "face front r"; Fb.className = "face back l";
    put(Ff, cur + 1); put(Fb, target);
    F.style.left = "50%"; F.style.transformOrigin = "left center";
  } else {
    put(L, target);
    Ff.className = "face front l"; Fb.className = "face back r";
    put(Ff, cur); put(Fb, target + 1);
    F.style.left = "0"; F.style.transformOrigin = "right center";
  }
  F.style.transition = "none"; F.style.transform = "rotateY(0deg)";
  void F.offsetWidth;
  F.style.transition = "transform .75s cubic-bezier(.45,.05,.25,1)";
  F.style.transform = `rotateY(${forward ? -180 : 180}deg)`;
  const done = () => {
    F.removeEventListener("transitionend", done);
    cur = target; render();
    F.classList.remove("on"); F.style.transition = "none"; F.style.transform = "rotateY(0deg)";
    busy = false;
  };
  F.addEventListener("transitionend", done);
}
const next = () => go(cur + step()), prev = () => go(cur - step());

$("#next").onclick = next; $("#prev").onclick = prev;
$("#rng").oninput = e => go(+e.target.value - 1);
addEventListener("keydown", e => {
  if (typing(e.target)) return;
  if ($("#toc").classList.contains("on")) { if (e.key === "Escape") closeToc(); return; }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
  else if (e.key === "Home") go(0); else if (e.key === "End") go(N - 1);
});
let sx = null, sy = null;
$("#stage").addEventListener("pointerdown", e => { if (typing(e.target)) { sx = null; return; } sx = e.clientX; sy = e.clientY; });
$("#stage").addEventListener("pointerup", e => {
  if (sx == null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) (dx < 0 ? next : prev)();
});
document.addEventListener("click", e => {
  const pl = e.target.closest(".play");
  if (pl) {
    if (!/^https?:$/.test(location.protocol)) { window.open(`https://www.youtube.com/watch?v=${pl.dataset.yt}`, "_blank", "noopener"); return; }
    const f = document.createElement("iframe"); f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin"); f.src = `https://www.youtube-nocookie.com/embed/${pl.dataset.yt}?autoplay=1&rel=0&playsinline=1`; f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin"); f.title = "영상"; f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true; pl.replaceWith(f); return; }
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); go(+g.dataset.go - 1); }
});

/* ---------- 목차 ---------- */
const tocEl = $("#toc");
function tocLabel(p, prevKind) {
  if (p.toc) return [p.toc, true];
  const k = p.kind;
  if (k === "parts") return ["필요한 부품", false];
  if (k === "video") return [/코딩/.test(p.eb) ? "코딩 영상 시청" : p.eb.indexOf("영상") === 0 ? p.title : "회로 영상 시청", false];
  if (k === "step" && prevKind !== "step") return ["회로 만들기 · 순서대로 따라하기", false];
  if (k === "done") return ["완성된 회로", false];
  if (k === "code" && prevKind !== "code") return ["코딩 순서", false];
  if (k === "run") return [p.title, false];
  if (k === "text" && /^개념 정리하기/.test(p.eb)) return [p.title, false];
  if (k === "text" && /^(과학적 상황|학습문제|확인하기|평가하기|공유하기|유의사항|실험 순서|실험 방법|실험 영상|실험 장치의 조건|코딩 살펴보기|회로 구성 및 *코딩하기|주요 부품 설명|추가 코딩 설명|사용될 코딩 설명)/.test(p.title)) return [p.title, false];
  return null;
}
function buildToc() {
  const groups = [];
  pages.forEach((p, i) => {
    if (p.kind === "end") return;
    const lab = i === 0 ? ["표지", true] : tocLabel(p, i ? pages[i - 1].kind : "");
    let g = groups[groups.length - 1];
    if (!g || g.chap !== p.chap || p.kind === "divider") { g = { chap: p.chap, from: i, to: i, items: [] }; groups.push(g); }
    g.to = i;
    if (lab && p.kind !== "divider") g.items.push({ i, t: lab[0] });
  });
  $("#tocList").innerHTML = groups.map(g => {
    const c = CHAPS[g.chap].c;
    return `<section class="ch" style="--c:${c}" data-from="${g.from}" data-to="${g.to}"><button type="button" class="chap" aria-expanded="false">${esc(CHAPS[g.chap].n)}<span class="rg">${g.from + 1}–${g.to + 1}쪽</span><i class="chev"></i></button><ol>${g.items.map(it => `<li><button type="button" data-i="${it.i}">${esc(it.t)}<span class="pg">${it.i + 1}쪽</span></button></li>`).join("")}</ol></section>`;
  }).join("");
}
function markToc() {
  const bs = [...document.querySelectorAll("#tocList button[data-i]")];
  let best = null;
  bs.forEach(b => { b.classList.remove("cur"); if (+b.dataset.i <= cur + (two ? 1 : 0)) best = b; });
  if (best) best.classList.add("cur");
  document.querySelectorAll("#tocList .ch").forEach(sec => {
    const on = best && sec.contains(best);
    sec.classList.toggle("open", !!on);
    sec.querySelector(".chap").setAttribute("aria-expanded", on ? "true" : "false");
  });
  return best;
}
function openToc() { tocEl.classList.add("on"); const b = markToc(); if (b) b.scrollIntoView({ block: "center" }); }
function closeToc() { tocEl.classList.remove("on"); }
$("#btnToc").onclick = openToc; $("#tocOpen").onclick = openToc; $("#tocX").onclick = closeToc;
tocEl.addEventListener("click", e => { if (e.target === tocEl) closeToc(); });
$("#tocList").addEventListener("click", e => {
  const h = e.target.closest(".chap");
  if (h) { const sec = h.parentElement, on = !sec.classList.contains("open"); sec.classList.toggle("open", on); h.setAttribute("aria-expanded", on); return; }
  const b = e.target.closest("button[data-i]"); if (!b) return; closeToc(); go(+b.dataset.i);
});

/* ---------- 시작 ---------- */
buildToc();
const h0 = (location.hash.match(/^#p(\d+)$/) || [])[1];
if (h0) cur = Math.max(0, Math.min(N - 1, +h0 - 1));
layout();
addEventListener("resize", layout);
addEventListener("hashchange", () => { const m = location.hash.match(/^#p(\d+)$/); if (m && +m[1] - 1 !== cur) go(+m[1] - 1); });
</script>
</body>
